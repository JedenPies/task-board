spring:
  application:
    name: task-board-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_TASK_BOARD_HOST}:${POSTGRES_TASK_BOARD_PORT}/${POSTGRES_TASK_BOARD_DATABASE}
    username: ${POSTGRES_TASK_BOARD_USERNAME}
    password: ${POSTGRES_TASK_BOARD_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    default-schema: public
jwt:
  secret: ${JWT_SECRET}

server:
  port: 8081