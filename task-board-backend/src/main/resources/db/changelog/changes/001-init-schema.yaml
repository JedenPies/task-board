databaseChangeLog:
  - changeSet:
      id: 1-create-task_boards-table
      author: patryk
      changes:
        - createTable:
            tableName: task_boards
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: 'name'
                  type: varchar(100)
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(30)
              - column:
                  name: task_board_id
                  type: uuid
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: task_board_id
            referencedTableName: task_boards
            referencedColumnNames: id
            constraintName: fk_tasks_boards