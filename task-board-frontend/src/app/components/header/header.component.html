<header class="navbar">
  <div class="navbar-container">
    <div class="logo">
      <a routerLink="/">Task Boards</a>
    </div>

    @if (authService.authorizationData()?.userDisplayName) {
      <span class="user-info">
        <i class="provider-icon small {{ authService.authorizationData()?.authProvider }}"></i>
        <a routerLink="/profile">
          <span>{{ authService.authorizationData()?.userDisplayName }}</span>
        </a>
      </span>
    }

    <nav>
      @if (authService.isLoggedIn()) {
        <button (click)="onLogoutClick()" class="btn-ghost" type="button">Sign Out</button>
      } @else {
        <button (click)="loginModal.open()" class="btn-primary" type="button">Sign In</button>
      }
    </nav>
  </div>
</header>

<app-login-modal></app-login-modal>
