<dialog #dialog class="modal-dialog">
  <form class="modern-form" [formGroup]="taskForm" (ngSubmit)="save()">

    <div class="modal-header">
      <h3>{{ currentTask() ? 'Edit task' : 'Add new task' }}</h3>
      <button class="btn-close" (click)="close()" type="button" title="Close">&times;</button>
    </div>

    <div class="form-group">
      <label for="title">Name *</label>
      <input id="title" type="text" formControlName="title" placeholder="Enter task name..." />
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" rows="5" formControlName="description"
                placeholder="Add some description..."></textarea>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="close()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="taskForm.invalid || isSaving()">
        {{ isSaving() ? 'Saving...' : 'Save' }}
      </button>
    </div>

  </form>
</dialog>
