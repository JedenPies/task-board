<dialog #dialog class="modal-dialog">
  <form class="modern-form" [formGroup]="taskForm" (ngSubmit)="save()">

    <div class="modal-header">
      <h3>{{ currentTask() ? 'Edytuj zadanie' : 'Dodaj nowe zadanie' }}</h3>
      <button class="close-btn" (click)="close()" type="button" title="Zamknij">&times;</button>
    </div>

    <div class="form-group">
      <label for="title">Tytuł zadania *</label>
      <input id="title" type="text" formControlName="title" placeholder="Wpisz nazwę zadania..." />
    </div>

    <div class="form-group">
      <label for="description">Opis zadania</label>
      <textarea id="description" rows="5" formControlName="description"
                placeholder="Dodaj szerszy opis..."></textarea>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="close()">Anuluj</button>
      <button type="submit" class="btn-submit" [disabled]="taskForm.invalid || isSaving()">
        {{ isSaving() ? 'Zapisywanie...' : 'Zapisz' }}
      </button>
    </div>

  </form>
</dialog>
