<main class="main-content">
  <h2>Twoje Tablice</h2>
  <section class="board-form">
    <form (submit)="createBoard(); $event.preventDefault()" class="search-box">
      <input type="text" [(ngModel)]="newBoardTitle" name="title" required placeholder="Nazwa nowej tablicy">
      <button type="submit" class="btn-primary">Dodaj</button>
    </form>
  </section>

  <!-- Lista tablic -->
  @if (authService.isLoggedIn()) {
    <section class="boards-list-section">
      <ul class="boards-list">
        @for (board of boards(); track board.id) {
          <li class="taskboard-card-container"> <a class="taskboard-card-link" [routerLink]="['/board', board.id]">
            <h3>{{ board.name }}</h3>
          </a>
            <button class="btn-delete" (click)="deleteTaskBoard(board)" title="Usuń tablicę">×</button>
          </li>
        } @empty {
          <p>Nie masz jeszcze żadnych tablic.</p>
        }
      </ul>
    </section>

    @if (taskBoardBeingDeleted(); as taskBoard) {
      <div class="snackbar-undo">
        <span>Usunięto zadanie: <strong>{{ taskBoard.name }}</strong></span>
        <button class="btn-undo" (click)="onUndoDelete()">Cofnij</button>
      </div>
    }

  }


</main>
