databaseChangeLog:
  - changeSet:
      id: 1-create-users-table
      author: patryk
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: 'login'
                  type: varchar(200)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: 'password_encoded'
                  type: varchar(200)
        - createTable:
            tableName: user_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: refresh_token
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: valid_until
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_users