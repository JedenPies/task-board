spring:
  application:
    name: task-board-auth
  datasource:
    url: jdbc:postgresql://${POSTGRES_TASK_BOARD_AUTH_HOST}:${POSTGRES_TASK_BOARD_AUTH_PORT}/${POSTGRES_TASK_BOARD_AUTH_DATABASE}
    username: ${POSTGRES_TASK_BOARD_AUTH_USERNAME}
    password: ${POSTGRES_TASK_BOARD_AUTH_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    default-schema: public

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000

oauth2:
  github:
    client-id: ${OAUTH2_GITHUB_CLIENT_ID}
    client-secret: ${OAUTH2_GITHUB_CLIENT_SECRET}
  google:
    client-id: ${OAUTH2_GOOGLE_CLIENT_ID}
    client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET}